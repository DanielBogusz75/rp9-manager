[project]
name = "rp9-manager"
version = "0.1.0"
description = "Manager, creator en launcher voor Cloanto .rp9-bestanden (Amiga/C64)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Bogusz", email = "daniel.1975.box@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["PyQt6>=6.6"]

[project.scripts]
rp9-manager = "rp9_manager:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
